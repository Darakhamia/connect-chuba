version: '3.8'

services:
  # База данных PostgreSQL (только внутренний, порт наружу НЕ открываем)
  db:
    image: postgres:15-alpine
    container_name: connect-chuba-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: chuba_user
      POSTGRES_PASSWORD: Ch8b4_Pr0d_2026!
      POSTGRES_DB: connect_chuba
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chuba_user"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # Приложение Connect Chuba
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: connect-chuba-app
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://chuba_user:Ch8b4_Pr0d_2026!@db:5432/connect_chuba
      - HOSTNAME=0.0.0.0
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.connect-chuba.rule=Host(`chat.airecho.net`)"
      - "traefik.http.routers.connect-chuba.entrypoints=websecure"
      - "traefik.http.routers.connect-chuba.tls.certresolver=letsencrypt"
      - "traefik.http.services.connect-chuba.loadbalancer.server.port=3000"

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
  traefik-public:
    external: true
