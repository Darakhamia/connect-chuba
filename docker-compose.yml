services:
  # База данных PostgreSQL (только внутренний, порт наружу НЕ открываем)
  db:
    image: postgres:15-alpine
    container_name: connect-chuba-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: chuba_user
      POSTGRES_PASSWORD: Ch8b4_Pr0d_2026!
      POSTGRES_DB: connect_chuba
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chuba_user"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # LiveKit - Voice/Video сервер
  livekit:
    image: livekit/livekit-server:latest
    container_name: connect-chuba-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      # LiveKit HTTP/WebSocket (для Cloudflare Tunnel)
      - "7880:7880/tcp"
      # WebRTC UDP media
      - "50000-50200:50000-50200/udp"
      # TURN TCP fallback
      - "7881:7881/tcp"
    networks:
      - internal

  # Приложение Connect Chuba
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        - NEXT_PUBLIC_CLERK_SIGN_IN_URL=${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-/sign-in}
        - NEXT_PUBLIC_CLERK_SIGN_UP_URL=${NEXT_PUBLIC_CLERK_SIGN_UP_URL:-/sign-up}
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
        - NEXT_PUBLIC_LIVEKIT_URL=${NEXT_PUBLIC_LIVEKIT_URL}
    container_name: connect-chuba-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://chuba_user:Ch8b4_Pr0d_2026!@db:5432/connect_chuba
      - HOSTNAME=0.0.0.0
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
